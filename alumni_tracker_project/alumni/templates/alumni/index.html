<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Alumni Tracker</title>
</head>
<body>
    <h1>Add Alumni Details</h1>
    <form method="post" action="{% url 'index' %}">
        {% csrf_token %}
        <label for="name">Name:</label><br>
        <input type="text" id="name" name="name" required><br><br>
        
        <label for="usn">USN:</label><br>
        <input type="text" id="usn" name="usn" required><br><br>
        
        <label for="passing_year">Passing Year:</label><br>
        <input type="number" id="passing_year" name="passing_year" required><br><br>
        
        <label for="company">Company:</label><br>
        <input type="text" id="company" name="company" required><br><br>
        
        <button type="submit">Add Alumni</button>
    </form>

    <br>
    <a href="{% url 'search' %}">Search Alumni by Passing Year</a>
</body>
</html>
