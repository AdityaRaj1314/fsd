<!DOCTYPE html>
<html>
<head>
    <title>Student Grade Application</title>
</head>
<body>
    <h2>Add New Student</h2>
    <form method="POST" action="{% url 'add_student' %}">
        {% csrf_token %}
        Name: <input type="text" name="name" required><br><br>
        USN: <input type="text" name="usn" required><br><br>
        Department: <input type="text" name="department" required><br><br>
        Grade: <input type="text" name="grade" required><br><br>
        <button type="submit">Submit</button>
    </form>

    <br>
    <a href="{% url 'update_grade' %}">Go to Update Grade</a>

    <h2>Student List</h2>
    <table border="1">
        <tr>
            <th>Name</th>
            <th>USN</th>
            <th>Department</th>
            <th>Grade</th>
        </tr>
        {% for student in students %}
        <tr>
            <td>{{ student.name }}</td>
            <td>{{ student.usn }}</td>
            <td>{{ student.department }}</td>
            <td>{{ student.grade }}</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
