<!DOCTYPE html>
<html>
{{ ... }}
    <title>Faculty Management</title>
</head>
<body>
    <h2>Add Faculty Member</h2>

    <form method="POST" action="{% url 'add_faculty' %}">
        {% csrf_token %}
        ID: <input type="text" name="emp_id" required><br><br>
        Title: <input type="text" name="title" required><br><br>
        Name: <input type="text" name="name" required><br><br>
        Branch: <input type="text" name="branch" required><br><br>
        <button type="submit">Submit</button>
    </form>

    <hr>

    <h2>CSE Professors</h2>
    <table border="1">
        <tr>
            <th>ID</th>
            <th>Title</th>
            <th>Name</th>
            <th>Branch</th>
        </tr>
        {% for f in faculty %}
        <tr>
            <td>{{ f.emp_id }}</td>
            <td>{{ f.title }}</td>
            <td>{{ f.name }}</td>
            <td>{{ f.branch }}</td>
        </tr>
        {% empty %}
        <tr>
            <td colspan="4">No CSE Professors found.</td>
        </tr>
        {% endfor %}
    </table>
</body>
</html>
